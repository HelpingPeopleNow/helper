syntax = "proto3";

package helper;

option go_package = "github.com/HelpingPeopleNow/backend/proto/helper";

service HelperService {
  rpc Ask(AskRequest) returns (AskResponse);
  // Embed returns an embedding vector for a single text. Used by the backend
  // for both query-time search and incremental re-embedding.
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // EmbedBatch returns embeddings for a list of texts in one round-trip.
  // Used by the backfill script in helper/scripts/backfill_embeddings.py and
  // by any bulk path that needs more than one embedding at a time.
  // Per-item status (success | dim_mismatch | fail) so a bad row doesn't
  // void the whole batch (P2-3).
  rpc EmbedBatch(EmbedBatchRequest) returns (EmbedBatchResponse);
}

message Message {
  string role = 1;
  string content = 2;
}

message AskRequest {
  string question = 1;
  repeated Message history = 2;
  string system_prompt = 3;  // loaded by backend, provided on every call
  string llm_provider = 4;   // "ollama" | "opencode" | "" (= use env default, set by admin)
  bool skip_role_detection = 5;  // if true, don't append JSON role-detection instructions
}

message AskResponse {
  string answer = 1;
  string detected_role = 2;  // "worker" | "client" | ""
}

// ── Embedding RPCs (VECTOR_SEARCH_PLAN §7.1) ────────────────────────

message EmbedRequest {
  // The text to embed. For worker profiles this is a field-specific text
  // (e.g. just the profession); for search this is the raw user query.
  string text = 1;

  // Optional model override. Empty string means: use the helper's default
  // embedding model (EMBEDDING_MODEL env var, e.g. "granite-embedding:278m").
  // Allows future migration to a different model without redeploying backend.
  string model = 2;
}

message EmbedResponse {
  // The embedding vector. 768 dimensions for granite-embedding:278m.
  // `repeated float` is wire-cheap: each dim is 4 bytes, packed array.
  repeated float embedding = 1;

  // Echo of the model used (either from request or the helper default).
  string model = 2;

  // Dimensions. Redundant with len(embedding) but useful for validation
  // before persisting (vector dimension mismatch silently corrupts search).
  int32 dimensions = 3;
}

message EmbedBatchRequest {
  // Multiple texts to embed in a single request.
  // Batch embedding for backfill efficiency.
  repeated string texts = 1;

  // Optional model override.
  string model = 2;
}

// Per-item result with explicit status (P2-3). One bad row no longer
// voids the entire batch — callers iterate items and decide what to do
// with each (e.g. backfill script skips failed items and upserts successes).
message EmbedBatchItem {
  int32 index = 1;             // position in the original request.texts
  string status = 2;           // "success" | "dim_mismatch" | "fail"
  repeated float embedding = 3; // empty unless status == "success"
  string model = 4;             // echoed model name (matches EmbedResponse)
  int32 dimensions = 5;         // 0 unless status == "success"
  string error = 6;             // diagnostic detail; status != "success" implies set
}

message EmbedBatchResponse {
  // One item per input text, in the same order as request.texts.
  // `items[i]` corresponds to `request.texts[i]` (i == item.index).
  repeated EmbedBatchItem items = 1;
}
